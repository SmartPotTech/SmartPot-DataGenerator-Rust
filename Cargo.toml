[package]
name = "smartpot-datagenerator"
version = "2.0.0"
edition = "2021"
authors = ["Sebastián López O <sebastianlopezosorno2005@gmail.com>"]
description = "Simulador de cultivos virtuales SmartPot en Rust: alto rendimiento, seguridad de memoria y contrato MQTT v1"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
rumqttc = "0.25"
rustls-pemfile = "2.2"
rustls-native-certs = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
rand_distr = "0.4"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
thiserror = "2.0"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
