name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Escaneo semanal los lunes a las 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: 'Detener y bloquear pipeline ante vulnerabilidades altas/críticas'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  snyk-sca:
    name: Snyk & RustSec Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Ensure Cargo.lock exists
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      # 1. Security Gate: RustSec Cargo Audit
      - name: Run RustSec Cargo Audit (Security Gate)
        run: |
          cargo audit --format sarif > snyk.sarif || {
            code=$?
            if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
              echo "::error::RustSec Security Gate BLOQUEADO: Se detectaron vulnerabilidades en dependencias de Rust (código $code)."
              exit 1
            else
              echo "::warning::cargo-audit reportó avisos o vulnerabilidades en dependencias de Rust (código $code)."
            fi
          }

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 2. Container Security Gate: Snyk Container
      - name: Run Snyk Container Scan
        run: |
          if [ -f Dockerfile ]; then
            snyk container test --file=Dockerfile --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold=high --sarif-file-output=snyk-container.sarif || {
              echo "::warning::Snyk Container detectó advertencias en el Dockerfile."
            }
          fi

      # 3. Alertar: Subir SARIF
      - name: Upload RustSec SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
          category: snyk-rust

      - name: Upload Container SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-container.sarif') != ''
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
